<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🌊 Our Honeymoon — Indonesia 2026</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #0a2342 0%, #1a5276 50%, #117a8b 100%); min-height: 100vh; color: #fff; }
    header { text-align: center; padding: 48px 20px 32px; }
    header h1 { font-size: 2.8rem; letter-spacing: 2px; text-shadow: 0 2px 8px rgba(0,0,0,0.3); }
    header p.subtitle { margin-top: 10px; font-size: 1.15rem; opacity: 0.85; }
    .countdown-bar { background: rgba(255,255,255,0.12); border-radius: 16px; max-width: 480px; margin: 20px auto 0; padding: 16px 24px; text-align: center; }
    .countdown-bar .label { font-size: 0.9rem; opacity: 0.75; margin-bottom: 4px; }
    .countdown-bar .days { font-size: 2.2rem; font-weight: 700; color: #f9ca24; }
    .timeline { max-width: 960px; margin: 0 auto; padding: 20px 16px 60px; display: flex; flex-direction: column; gap: 28px; }
    .stay-card { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18); border-radius: 20px; overflow: hidden; backdrop-filter: blur(8px); transition: transform 0.2s; }
    .stay-card:hover { transform: translateY(-3px); }
    .stay-header { display: flex; align-items: center; gap: 16px; padding: 22px 28px; cursor: pointer; user-select: none; }
    .stay-header .week-badge { background: rgba(249,202,36,0.25); border: 2px solid #f9ca24; color: #f9ca24; border-radius: 50px; padding: 6px 16px; font-size: 0.85rem; font-weight: 700; white-space: nowrap; }
    .stay-header h2 { flex: 1; font-size: 1.35rem; }
    .stay-header .location-tag { font-size: 0.82rem; opacity: 0.7; margin-top: 2px; }
    .stay-header .toggle-icon { font-size: 1.4rem; transition: transform 0.3s; }
    .stay-card.open .toggle-icon { transform: rotate(180deg); }
    .stay-body { display: none; padding: 0 28px 28px; border-top: 1px solid rgba(255,255,255,0.1); }
    .stay-card.open .stay-body { display: block; }
    .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-top: 20px; }
    .info-box { background: rgba(255,255,255,0.1); border-radius: 12px; padding: 14px 16px; }
    .info-box .ib-label { font-size: 0.75rem; opacity: 0.65; text-transform: uppercase; letter-spacing: 1px; }
    .info-box .ib-value { font-size: 1.05rem; font-weight: 600; margin-top: 4px; }
    .rating-badge { display: inline-flex; align-items: center; gap: 6px; background: #27ae60; border-radius: 8px; padding: 4px 12px; font-weight: 700; font-size: 1rem; margin-top: 12px; }
    .rating-sub { font-size: 0.8rem; opacity: 0.85; font-weight: 400; }
    .address-block { margin-top: 16px; background: rgba(0,0,0,0.2); border-radius: 10px; padding: 12px 16px; font-size: 0.92rem; line-height: 1.6; }
    .address-block .addr-label { font-size: 0.75rem; opacity: 0.6; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
    .days-row { margin-top: 22px; }
    .days-row h3 { font-size: 1rem; opacity: 0.85; margin-bottom: 12px; }
    .day-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .day-chip { background: rgba(255,255,255,0.12); border-radius: 8px; padding: 6px 12px; font-size: 0.82rem; border: 1px solid rgba(255,255,255,0.2); }
    .day-chip.today { background: #f9ca24; color: #0a2342; font-weight: 700; border-color: #f9ca24; }
    .notes-section { margin-top: 22px; }
    .notes-section h3 { font-size: 1rem; opacity: 0.85; margin-bottom: 10px; }
    .notes-section textarea { width: 100%; min-height: 80px; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; color: #fff; font-size: 0.92rem; padding: 10px 14px; resize: vertical; font-family: inherit; }
    .notes-section textarea::placeholder { opacity: 0.45; }
    .notes-section textarea:focus { outline: none; border-color: #f9ca24; }
    .save-btn { margin-top: 10px; background: #f9ca24; color: #0a2342; border: none; border-radius: 8px; padding: 8px 20px; font-weight: 700; cursor: pointer; font-size: 0.9rem; }
    .save-btn:hover { background: #f0c027; }
    .progress-section { max-width: 960px; margin: 0 auto; padding: 0 16px 40px; }
    .progress-section h3 { font-size: 1rem; opacity: 0.75; margin-bottom: 10px; text-align: center; }
    .progress-bar-outer { background: rgba(255,255,255,0.12); border-radius: 50px; height: 14px; overflow: hidden; }
    .progress-bar-inner { background: linear-gradient(90deg, #f9ca24, #f0932b); height: 100%; border-radius: 50px; transition: width 1s ease; }
    .progress-labels { display: flex; justify-content: space-between; font-size: 0.78rem; opacity: 0.65; margin-top: 6px; }
    .packing-section { max-width: 960px; margin: 0 auto; padding: 0 16px 60px; }
    .packing-card { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18); border-radius: 20px; padding: 24px 28px; }
    .packing-card h2 { font-size: 1.3rem; margin-bottom: 16px; }
    .checklist { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 8px; }
    .checklist li { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; }
    .checklist li input[type="checkbox"] { width: 16px; height: 16px; accent-color: #f9ca24; cursor: pointer; }
    .checklist li label { cursor: pointer; }
    .checklist li.checked label { text-decoration: line-through; opacity: 0.45; }
    footer { text-align: center; padding: 24px; opacity: 0.45; font-size: 0.82rem; }
  </style>
</head>
<body>
<header>
  <div style="font-size:3rem">&#127754;</div>
  <h1>Our Honeymoon</h1>
  <p class="subtitle">Indonesia 2026 &nbsp;&middot;&nbsp; 6 Weeks of Adventure &amp; Love</p>
  <div class="countdown-bar">
    <div class="label">Days until our honeymoon</div>
    <div class="days" id="countdown">&mdash;</div>
    <div class="label" id="countdown-sub"></div>
  </div>
</header>
<div class="progress-section">
  <h3>Journey Progress</h3>
  <div class="progress-bar-outer"><div class="progress-bar-inner" id="progressBar" style="width:0%"></div></div>
  <div class="progress-labels"><span id="progStart">&mdash;</span><span id="progEnd">&mdash;</span></div>
</div>
<div class="timeline" id="timeline"></div>
<div class="packing-section">
  <div class="packing-card">
    <h2>&#127890; Packing Checklist</h2>
    <ul class="checklist" id="packingList"></ul>
  </div>
</div>
<footer>Made with &#10084;&#65039; for our honeymoon adventure &middot; Indonesia 2026</footer>
<script>
var S=new Date('2026-09-01'),E=new Date('2026-10-12');
var stays=[
  {id:'stay1',wl:'Weeks 1–2',e:'&#127965;&#65039;',n:'SABA Lombok — Selong Belanak',sub:'Selong Belanak, Lombok',addr:'Dusun Serangan, Selong Belanak, 83572 Selong Belanak, Indonesia',sd:new Date('2026-09-01'),ed:new Date('2026-09-14'),r:'9.4',rn:'Excellent location · 4 reviews',hi:['Pristine white-sand beach at Selong Belanak','Beautiful surf waves perfect for beginners','Peaceful, authentic fishing village atmosphere','Stunning sunsets over the bay every evening'],c:'#1abc9c',bk:'Booking.com · Rated Excellent'},
  {id:'stay2',wl:'Weeks 3–4',e:'&#127807;',n:'Selong Selo',sub:'Selong Selo, North Lombok',addr:'Selong Selo, Bayan, North Lombok, West Nusa Tenggara, Indonesia',sd:new Date('2026-09-15'),ed:new Date('2026-09-28'),r:null,rn:'',hi:['Hilltop infinity pool overlooking lush rice terraces','Breathtaking panoramic views of Mount Rinjani','Secluded luxury resort surrounded by jungle','Short distance to the best beaches of Kuta Lombok'],c:'#8e44ad',bk:'Direct booking recommended'},
  {id:'stay3',wl:'Weeks 5–6',e:'&#10024;',n:'Third Destination — To Be Decided',sub:'Indonesia · Your choice!',addr:'Indonesia',sd:new Date('2026-09-29'),ed:new Date('2026-10-12'),r:null,rn:'',hi:['Option A: Gili Air or Gili Trawangan — crystal-clear water & coral reefs','Option B: Ubud, Bali — rice terraces, temples & culture','Option C: Nusa Penida — dramatic cliffs & world-class snorkelling','Option D: Stay longer in Lombok and explore more!'],c:'#e67e22',bk:'— to be confirmed —'}
];
var PI=['Passport & copies','Flight tickets','Travel insurance','Vaccination card','Sunscreen SPF 50+','After-sun lotion','Mosquito repellent','First aid kit','Swimwear (multiple)','Flip flops','Sandals','Light dresses / shirts','Rain jacket','Sarong / wrap','Snorkelling mask','Underwater camera','Power bank','Universal adapter','Phone charger','E-reader / books','Cash (IDR / EUR)','Credit / debit cards','Small daypack','Dry bag','Electrolyte tablets','Stomach medicine','Hand sanitiser','Reusable water bottle'];
function fd(d){return d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});}
function toggleCard(id){document.getElementById(id).classList.toggle('open');}
function saveNote(id){var v=document.getElementById('note_'+id).value;localStorage.setItem('note_'+id,v);var b=document.querySelector('#'+id+' .save-btn');b.textContent='Saved ✓';setTimeout(function(){b.textContent='Save note';},1500);}
function renderTimeline(){
  var c=document.getElementById('timeline');c.innerHTML='';
  var t=new Date();t.setHours(0,0,0,0);var ms=86400000;
  stays.forEach(function(s){
    var card=document.createElement('div');card.className='stay-card';card.id=s.id;
    var n=Math.round((s.ed-s.sd)/ms)+1;var ch='';
    for(var i=0;i<n;i++){var d=new Date(s.sd.getTime()+i*ms);var it=d.getTime()===t.getTime();var lb=d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});ch+='<span class="day-chip'+(it?' today':'')+'">'+( it?'★ ':'')+lb+(it?' (Today)':'')+' </span>';}
    var sn=localStorage.getItem('note_'+s.id)||'';
    card.innerHTML='<div class="stay-header" onclick="toggleCard(''+s.id+'')"><span class="week-badge">'+s.wl+'</span><div><h2>'+s.e+' '+s.n+'</h2><div class="location-tag">&#128205; '+s.sub+'</div></div><div class="toggle-icon">&#9660;</div></div>'+'<div class="stay-body"><div class="info-grid"><div class="info-box"><div class="ib-label">Check-in</div><div class="ib-value">'+fd(s.sd)+'</div></div><div class="info-box"><div class="ib-label">Check-out</div><div class="ib-value">'+fd(s.ed)+'</div></div><div class="info-box"><div class="ib-label">Duration</div><div class="ib-value">14 nights</div></div><div class="info-box"><div class="ib-label">Booking</div><div class="ib-value" style="font-size:.9rem">'+s.bk+'</div></div></div>'+(s.r?'<div class="rating-badge">&#11088; '+s.r+'/10 <span class="rating-sub">'+s.rn+'</span></div>':'')+'<div class="address-block"><div class="addr-label">Address</div>'+s.addr+'</div><div style="margin-top:18px"><div style="font-size:.82rem;opacity:.65;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">Highlights</div><ul style="list-style:none;display:flex;flex-direction:column;gap:6px">'+s.hi.map(function(h){return'<li style="display:flex;align-items:flex-start;gap:8px"><span style="color:#f9ca24">&#10022;</span> '+h+'</li>';}).join('')+'</ul></div><div class="days-row"><h3>&#128197; Day by day</h3><div class="day-chips">'+ch+'</div></div><div class="notes-section"><h3>&#128221; Notes & wishes</h3><textarea id="note_'+s.id+'" placeholder="Write something special here..." rows="3">'+sn+'</textarea><button class="save-btn" onclick="saveNote(''+s.id+'')">Save note</button></div></div>';
    card.style.borderLeft='4px solid '+s.c;c.appendChild(card);
  });
  var t2=new Date();t2.setHours(0,0,0,0);var op=false;
  stays.forEach(function(s){if(!op&&t2>=s.sd&&t2<=s.ed){document.getElementById(s.id).classList.add('open');op=true;}});
  if(!op)document.getElementById(stays[0].id).classList.add('open');
}
function updateCountdown(){var now=new Date();now.setHours(0,0,0,0);var diff=Math.ceil((S-now)/86400000);var el=document.getElementById('countdown');var sub=document.getElementById('countdown-sub');if(diff>0){el.textContent=diff;sub.textContent="days to go — can't wait! &#127881;";}else if(diff===0){el.textContent="Today! &#127882;";sub.textContent="The adventure begins!";}else{if(now<=E){el.textContent="Day "+(Math.abs(diff)+1);sub.textContent="We are on our honeymoon! &#127802;";}else{el.textContent="&#9992;&#65039; Back home";sub.textContent="What an incredible adventure!";}}}
function updateProgress(){var now=new Date();var pct=Math.min(100,Math.max(0,(now-S)/(E-S)*100));document.getElementById('progressBar').style.width=pct.toFixed(1)+'%';document.getElementById('progStart').textContent=fd(S);document.getElementById('progEnd').textContent=fd(E);}
function renderPacking(){var ul=document.getElementById('packingList');ul.innerHTML='';PI.forEach(function(item,i){var ck=localStorage.getItem('pack_'+i)==='1';var li=document.createElement('li');if(ck)li.classList.add('checked');li.innerHTML='<input type="checkbox" id="pack'+i+'"'+(ck?' checked':'')+'>  <label for="pack'+i+'">'+item+'</label>';li.querySelector('input').addEventListener('change',function(){localStorage.setItem('pack_'+i,this.checked?'1':'0');li.classList.toggle('checked',this.checked);});ul.appendChild(li);});}
renderTimeline();updateCountdown();updateProgress();renderPacking();
</script>
</body>
</html>
