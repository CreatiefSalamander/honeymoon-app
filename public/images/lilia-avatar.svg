<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#9b6080"/>
      <stop offset="60%" stop-color="#5c2d45"/>
      <stop offset="100%" stop-color="#2a0e1a"/>
    </radialGradient>
    <radialGradient id="hair" cx="50%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#2a1810"/>
      <stop offset="100%" stop-color="#0f0808"/>
    </radialGradient>
  </defs>
  <!-- Achtergrond -->
  <circle cx="100" cy="100" r="100" fill="#0a1628"/>
  <circle cx="100" cy="100" r="96" fill="url(#bg)"/>
  <!-- Goud ring -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="#c9a84c" stroke-width="5"/>
  <!-- Haar (donker, golvend) -->
  <ellipse cx="100" cy="55" rx="36" ry="40" fill="url(#hair)"/>
  <ellipse cx="68" cy="90" rx="18" ry="45" fill="url(#hair)"/>
  <ellipse cx="132" cy="90" rx="18" ry="45" fill="url(#hair)"/>
  <!-- Gezicht -->
  <ellipse cx="100" cy="80" rx="26" ry="30" fill="#e8c4a0"/>
  <!-- Ogen -->
  <ellipse cx="90" cy="75" rx="5" ry="4" fill="#3a2010"/>
  <ellipse cx="110" cy="75" rx="5" ry="4" fill="#3a2010"/>
  <!-- Lippen (bordeaux) -->
  <ellipse cx="100" cy="92" rx="9" ry="4" fill="#8b3a4a"/>
  <!-- Ketting -->
  <path d="M88 112 Q100 118 112 112" stroke="#c0c0c0" stroke-width="1.5" fill="none"/>
  <circle cx="100" cy="118" r="2.5" fill="#c0c0c0"/>
  <!-- Letter L subtiel -->
  <text x="100" y="155" font-family="Georgia, serif" font-size="22" 
        text-anchor="middle" fill="rgba(201,168,76,0.6)">Lilia</text>
</svg>
